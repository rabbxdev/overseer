<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="overseerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7F00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF5500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF2200;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Eye / Overseer Symbol -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="180" fill="url(#overseerGrad)" opacity="0.15"/>
    <path d="M256 120C160 120 80 200 80 256C80 312 160 392 256 392C352 392 432 312 432 256C432 200 352 120 256 120Z" fill="url(#overseerGrad)"/>
    <circle cx="256" cy="256" r="60" fill="white" fill-opacity="0.95"/>
    <circle cx="256" cy="256" r="35" fill="url(#overseerGrad)"/>
    <circle cx="268" cy="244" r="10" fill="white"/>
  </g>
  
  <!-- Watcher Rays -->
  <g stroke="url(#overseerGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="40" x2="256" y2="80"/>
    <line x1="256" y1="432" x2="256" y2="472"/>
    <line x1="40" y1="256" x2="80" y2="256"/>
    <line x1="432" y1="256" x2="472" y2="256"/>
    <line x1="105" y1="105" x2="130" y2="130"/>
    <line x1="382" y1="382" x2="407" y2="407"/>
    <line x1="105" y1="407" x2="130" y2="382"/>
    <line x1="382" y1="130" x2="407" y2="105"/>
  </g>
</svg>